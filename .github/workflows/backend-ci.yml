name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Ruff and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: job_search_crm
          POSTGRES_USER: job_search_crm
          POSTGRES_PASSWORD: job_search_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_search_crm -d job_search_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run python -B -m pytest

      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql+psycopg://job_search_crm:job_search_crm@localhost:5432/job_search_crm
        run: uv run alembic upgrade head
