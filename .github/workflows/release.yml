name: CI and images

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This workflow only builds images. Deployment will need its own non-cancelling lock.
concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  images:
    name: Build and scan images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: deploy/backend.Dockerfile
          - service: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image coordinates
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ref=${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          digest_ref=$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}')
          printf 'Published: `%s`\n\nImmutable reference: `%s`\n' "$IMAGE_REF" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
