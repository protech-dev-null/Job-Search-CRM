name: CI and images

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the VDS after publishing images
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a main workflow while it may be migrating production data.
concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        run: echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  deploy-scripts:
    name: Deployment script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash -n deploy/deploy-release.sh
          bash -n deploy/ssh-deploy-command.sh
          python3 deploy/tests/test_deploy.py

  images:
    name: Build and scan images
    needs: [backend, frontend, release, deploy-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: deploy/backend.Dockerfile
          - service: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image coordinates
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          tag="$RELEASE_TAG"
          echo "ref=${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          digest_ref=$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}')
          printf 'Published: `%s`\n\nImmutable reference: `%s`\n' "$IMAGE_REF" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VDS
    needs: [release, images]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: crm-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy published release over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VDS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY" || { echo '::error::production secret VDS_SSH_KEY is empty'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo '::error::production secret VDS_KNOWN_HOSTS is empty'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          if ! ssh-keygen -F 135.106.220.160 -f "$ssh_dir/known_hosts" > "$ssh_dir/host_match"; then
            echo '::error::VDS_KNOWN_HOSTS has no entry for 135.106.220.160. Update the secret in environment production; use the complete known_hosts line, not a SHA256 fingerprint or a .pub key alone.'
            exit 1
          fi
          awk '$2 == "ssh-ed25519" { print }' "$ssh_dir/host_match" > "$ssh_dir/ed25519"
          if ! ssh-keygen -lf "$ssh_dir/ed25519" > "$ssh_dir/fingerprint" 2>/dev/null; then
            echo '::error::VDS_KNOWN_HOSTS contains no valid ED25519 key for this IP. Copy the full single line from the trusted VDS console, without quotes, Markdown or literal backslash-n characters.'
            exit 1
          fi
          echo 'Configured server fingerprint (public, compare with the VDS console):'
          cat "$ssh_dir/fingerprint"
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null 2>/dev/null; then
            echo '::error::VDS_SSH_KEY must be a complete private OpenSSH key without a passphrase, including BEGIN and END lines.'
            exit 1
          fi
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            root@135.106.220.160 "deploy $RELEASE_TAG"

      - name: Verify public HTTPS endpoint
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 20 https://roman-job-crm.duckdns.org/)
          test "$code" = 401
          echo 'VDS deployment and public HTTPS check succeeded.' >> "$GITHUB_STEP_SUMMARY"
