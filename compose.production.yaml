name: crm-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging: *logging

  api:
    image: job-crm-api:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      BACKEND_CORS_ORIGINS: https://${CRM_DOMAIN:?Set CRM_DOMAIN}
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    mem_limit: 768m
    logging: *logging

  web:
    image: job-crm-web:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM_DOMAIN}
    secrets: [web_auth]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *logging

secrets:
  db_password:
    file: /etc/job-crm/secrets/db_password
  web_auth:
    file: /etc/job-crm/secrets/web_auth

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
